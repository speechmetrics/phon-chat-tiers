name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check the specification states this version
        run: |
          base="${VERSION%-rc.*}"
          re="^\*\*Version:\*\* ${base//./\\.}"
          case "$VERSION" in
            *-rc.*) re="$re( \(draft\))?\$" ;;
            *)      re="$re\$" ;;
          esac
          grep -qE "$re" spec/phon-chat-tiers.md \
            || { echo "spec/phon-chat-tiers.md does not state version $base exactly (a final tag needs the header without '(draft)')"; exit 1; }

      - name: Check the example set is not empty
        run: ls examples/valid/*.cha examples/invalid/*.cha >/dev/null

      - name: Build the example zip
        run: |
          stage="phon-chat-tiers-examples-$VERSION"
          mkdir -p "dist/$stage"
          cp -R examples/. "dist/$stage/"
          (cd dist && zip -r "$stage.zip" "$stage")
          cp spec/phon-chat-tiers.md "dist/phon-chat-tiers-$VERSION.md"
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-rc.*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "Phon Tiers in CHAT $VERSION" \
            --notes "Specification and example files, version $VERSION. See Appendix B of the specification for the changes." \
            "dist/phon-chat-tiers-examples-$VERSION.zip" \
            "dist/phon-chat-tiers-$VERSION.md"
